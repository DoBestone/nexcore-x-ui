    ],
  },

    method: 'POST', path: '/api/v1/xray/restart',

  },

// ============ 3. 入站 (Inbound) ============
{ key: 'inbounds', title: '入站列表 (Inbound)', items: [
  { key: 'inbound-list',

      { name: 'size',     type: 'int',      required: false, desc: '页大小,默认 50,上限 200' },
    ],
    response: [
      {
        id: 1, up: 12345, down: 67890, total: 0, remark: 'node-A', enable: true, expiryTime: 0,

        settings: '{"clients":[{"id":"<UUID>","flow":"xtls-rprx-vision","email":"alice"}],"decryption":"none"}',
        streamSettings: '{"network":"tcp","security":"reality","realitySettings":{"...":"..."}}',
        tag: 'inbound-443',
        sniffing: '{"enabled":true,"destOverride":["http","tls"]}',
      },
    ],
    responseFields: [
      { name: 'id',             type: 'int',     desc: '入站 ID(自增主键)' },
      { name: 'up / down',      type: 'int64',   desc: '累计上传 / 下载字节数' },

      { name: 'remark',         type: 'string',  desc: '备注名(面板显示)' },
      { name: 'enable',         type: 'bool',    desc: '是否启用' },
      { name: 'expiryTime',     type: 'int64',   desc: '过期时间(unix 毫秒);0 表示不过期' },
      { name: 'listen',         type: 'string',  desc: '监听地址,空串表示 0.0.0.0' },
      { name: 'port',           type: 'int',     desc: '监听端口(全局唯一)' },
      { name: 'protocol',       type: 'string',  desc: '协议名(见 query 说明)' },
      { name: 'settings',       type: 'json string', desc: 'xray inbound.settings 原文(透传)' },

      { name: 'sniffing',       type: 'json string', desc: 'xray sniffing 原文' },

    example: 'curl -H "Authorization: Bearer $TOKEN" \\\n  "$BASE/inbounds?protocol=vless&enable=true"',
  },
  { key: 'inbound-get',

    response: { id: 1, port: 443, protocol: 'vless', tag: 'inbound-443', enable: true },
    responseFields: [{ name: '...', type: 'Inbound', desc: '完整 Inbound 对象,字段同列表项' }],
    errors: [

      { code: 'inbound_not_found',  desc: '没有该入站' },

  },

    body: {
      remark: 'node-A', enable: true, expiryTime: 0, total: 0,
      listen: '', port: 443, protocol: 'vless', tag: 'inbound-443',
      settings: '{"clients":[{"id":"<UUID>","flow":"xtls-rprx-vision","email":"alice"}],"decryption":"none"}',
      streamSettings: '{"network":"tcp","security":"reality","realitySettings":{}}',
      sniffing: '{"enabled":true,"destOverride":["http","tls"]}',
    },
    bodyFields: [
      { name: 'port',           type: 'int',         required: true,  desc: '监听端口' },
      { name: 'protocol',       type: 'string',      required: true,  desc: '协议名' },
      { name: 'tag',            type: 'string',      required: true,  desc: '全局唯一 tag' },
      { name: 'settings',       type: 'json string', required: true,  desc: 'xray settings 原文' },

      { name: 'listen',         type: 'string',      required: false, desc: '监听地址,默认空(0.0.0.0)' },
      { name: 'remark',         type: 'string',      required: false, desc: '备注名' },
      { name: 'enable',         type: 'bool',        required: false, desc: '是否启用,默认 true' },
      { name: 'expiryTime',     type: 'int64',       required: false, desc: 'unix 毫秒,0=不过期' },
      { name: 'total',          type: 'int64',       required: false, desc: '流量上限(字节),0=不限' },
    ],
    response: { id: 1, port: 443, protocol: 'vless', tag: 'inbound-443', enable: true },

      { code: 'invalid_body',  desc: 'body 不是合法 JSON' },
      { code: 'create_failed', desc: '通常是 port / tag 冲突或字段非法' },
    ],
  },
  { key: 'inbound-update',
    title: '全量更新入站',
    method: 'PUT', path: '/api/v1/inbounds/:id',

    pathParams: [{ name: 'id', type: 'int', desc: '入站 ID' }],
    body: { id: 1, port: 443, protocol: 'vless', enable: false, '...其余字段': '同 POST' },
    response: { id: 1, enable: false },
    errors: [
      { code: 'invalid_id',     desc: 'id 不是整数' },
      { code: 'invalid_body',   desc: 'body 不是合法 JSON' },
      { code: 'update_failed',  desc: '更新数据库失败 / 字段冲突' },
    ],
  },
  { key: 'inbound-toggle',
    title: '开关入站',
    method: 'PATCH', path: '/api/v1/inbounds/:id/enable',

    errors: [

  },
  { key: 'inbound-reset-traffic',

    method: 'POST', path: '/api/v1/inbounds/:id/reset-traffic',

    pathParams: [{ name: 'id', type: 'int', desc: '入站 ID' }],
    response: { id: 1, up: 0, down: 0, total: 0 },
  },
  { key: 'inbound-bulk-create',
    title: '批量创建入站',
    method: 'POST', path: '/api/v1/inbounds/bulk',
    desc: '一次提交多个 Inbound 对象。原子语义:任一失败则整批回滚。',
    body: [
      { port: 10001, protocol: 'vless', tag: 't1', settings: '...', streamSettings: '...', sniffing: '...' },
      { port: 10002, protocol: 'vmess', tag: 't2', settings: '...', streamSettings: '...', sniffing: '...' },
    ],
    response: { created: 2, items: [{ id: 5 }, { id: 6 }] },
    responseFields: [
      { name: 'created', type: 'int',       desc: '本次新建条数' },
      { name: 'items',   type: 'Inbound[]', desc: '完整新建对象数组' },
    ],
  },
  { key: 'inbound-bulk-enable',
    title: '批量启用 / 禁用',
    method: 'PATCH', path: '/api/v1/inbounds/bulk-enable',
    body: { ids: [1, 2, 3], enable: false },
    bodyFields: [
      { name: 'ids',    type: 'int[]', required: true,  desc: '要修改的入站 ID 列表' },
      { name: 'enable', type: 'bool',  required: true,  desc: 'true 启用 / false 禁用' },
    ],
    response: { affected: 3 },
    responseFields: [{ name: 'affected', type: 'int', desc: '实际命中并更新的行数' }],
  },
  { key: 'inbound-bulk-delete',
    title: '批量删除入站',
    method: 'POST', path: '/api/v1/inbounds/bulk-delete',
    body: { ids: [1, 2, 3] },
    bodyFields: [{ name: 'ids', type: 'int[]', required: true, desc: '要删除的入站 ID 列表' }],
    response: { affected: 3 },
  },
  { key: 'inbound-reset-all-traffic',
    title: '批量重置流量',
    method: 'POST', path: '/api/v1/inbounds/reset-all-traffic',
    desc: '不传 ids 则重置全部入站流量。',
    body: { ids: [1, 2, 3] },
    bodyFields: [{ name: 'ids', type: 'int[]', required: false, desc: '要重置的入站 ID;不传则全部' }],
    response: { affected: 3 },
  },
]},

// ============ 4. 客户端 (Client) ============
{ key: 'clients', title: '客户端 (Client)', items: [
  { key: 'client-list',
    title: '列出某入站的客户端',
    method: 'GET', path: '/api/v1/inbounds/:id/clients',
    desc: '返回该入站 settings.clients 数组的解析结果。字段因协议不同而异。',

      { id: '<UUID2>', email: 'bob',   flow: 'xtls-rprx-vision' },
    ],
    responseFields: [
      { name: 'id',       type: 'string', desc: 'VLESS / VMess 用 UUID;Trojan / SS 这里通常缺省,密码在 password 字段' },

    response: { id: 1, port: 443, settings: '{"clients":[ ... 已包含 carol ... ]}' },

  },

    desc: '成功返回 204 No Content。',

    pathParams: [{ name: 'id', type: 'int', desc: '入站 ID' }],
    queryParams: [{ name: 'host', type: 'string', required: true, desc: '对外可达地址' }],
