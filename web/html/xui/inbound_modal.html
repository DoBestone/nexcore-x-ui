{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        // 当 useRawStream=true 时,inbounds.html 提交时会用 rawStreamSettings 当
        // streamSettings,绕过 inbound.stream.toString() 的 form-to-JSON 流程。
        // 这是 v1.0.6 让用户能在 UI 里立刻用 REALITY / XHTTP 的最小手段 ——
        // 完整专用表单留 v1.0.7+。后端 dry-run 兜底,写错直接拒绝不会害到面板。
        useRawStream: false,
        rawStreamSettings: '',
        // REALITY 表单输入器状态(v1.0.8)。和 useRawStream 联动:
        // applyRealityForm() 把这些字段拼成完整 reality streamSettings JSON,
        // 写到 rawStreamSettings + 设 useRawStream=true。下次打开 modal 重置。
        realityForm: {
            dest: 'www.cloudflare.com:443',
            serverNames: 'www.cloudflare.com',
            privateKey: '',
            publicKey: '',
            shortIds: '',
            fingerprint: 'chrome',
        },
        // HTTPUpgrade / XHTTP 表单状态(v1.0.9)。
        // 同 reality:apply 方法把字段拼成 streamSettings JSON 写到原文模式
        // textarea + 启用 useRawStream。后端 dry-run 兜底。
        huForm: {
            host: '', path: '/', tls: true,
            tlsServer: '', certFile: '', keyFile: '',
        },
        xhForm: {
            host: '', path: '/', mode: 'auto', tls: true,
            tlsServer: '', certFile: '', keyFile: '',
        },
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            // Each show() resets raw-mode — operator opts in per-edit, so
            // an old inbound that was saved with raw JSON gets re-rendered
            // through the form on the next open (and they can flip raw back
            // on if they need to keep editing the JSON).
            this.useRawStream = false;
            this.rawStreamSettings = '';
            this.realityForm = {
                dest: 'www.cloudflare.com:443',
                serverNames: 'www.cloudflare.com',
                privateKey: '',
                publicKey: '',
                shortIds: '',
                fingerprint: 'chrome',
            };
            this.huForm = {
                host: '', path: '/', tls: true,
                tlsServer: '', certFile: '', keyFile: '',
            };
            this.xhForm = {
                host: '', path: '/', mode: 'auto', tls: true,
                tlsServer: '', certFile: '', keyFile: '',
            };
            this.confirm = confirm;
            this.visible = true;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        DOKODEMO: Protocols.DOKODEMO,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            }
        },
        methods: {
            streamNetworkChange(oldValue) {
                if (oldValue === 'kcp') {
                    this.inModal.inbound.tls = false;
                }
            },
            // Pre-baked streamSettings JSON snippets so users don't have to
            // memorize the schema. The placeholder values (PUBLIC_KEY etc.)
            // are intentionally obvious so xray test will reject them on
            // submit — forcing the operator to fill them in instead of
            // accidentally shipping a template inbound.
            loadStreamTemplate(kind) {
                let snippet;
                if (kind === 'reality') {
                    snippet = {
                        network: 'tcp',
                        security: 'reality',
                        realitySettings: {
                            show: false,
                            dest: 'www.cloudflare.com:443',
                            xver: 0,
                            serverNames: ['www.cloudflare.com'],
                            privateKey: '<RUN: xray x25519 — 把 Private key 贴这里>',
                            publicKey:  '<RUN: xray x25519 — 把 Public key 贴这里>',
                            shortIds: ['', '0123abcd'],
                            fingerprint: 'chrome',
                        },
                    };
                } else if (kind === 'xhttp') {
                    snippet = {
                        network: 'xhttp',
                        security: 'tls',
                        xhttpSettings: {
                            host: '',
                            path: '/your-path',
                            mode: 'auto',  // auto | packet-up | stream-up
                        },
                        tlsSettings: {
                            serverName: 'your.domain.com',
                            certificates: [
                                { certificateFile: '/root/cert/your.cer', keyFile: '/root/cert/your.key' },
                            ],
                            alpn: ['h2', 'http/1.1'],
                        },
                    };
                } else if (kind === 'httpupgrade') {
                    snippet = {
                        network: 'httpupgrade',
                        security: 'tls',
                        httpupgradeSettings: {
                            host: 'your.domain.com',
                            path: '/your-path',
                        },
                        tlsSettings: {
                            serverName: 'your.domain.com',
                            certificates: [
                                { certificateFile: '/root/cert/your.cer', keyFile: '/root/cert/your.key' },
                            ],
                        },
                    };
                } else if (kind === 'current') {
                    // Re-pull from the form-side model: lets the user start
                    // from whatever they already configured (TLS+TCP etc.)
                    // and tweak just the new fields they need.
                    try {
                        snippet = JSON.parse(this.inModal.inbound.stream.toString());
                    } catch (e) {
                        snippet = {};
                    }
                }
                this.inModal.rawStreamSettings = JSON.stringify(snippet, null, 2);
            },

            // applyRealityForm 把表单字段拼成完整 reality streamSettings JSON,
            // 写到 rawStreamSettings 并启用原文模式 — 等价于"用户填表 → 生成
            // JSON → 直接用原文模式提交"。privateKey/publicKey 留空时也允许
            // 应用,后端 dry-run 会以 xray 自己的错误信息精确告诉用户哪个字段
            // 还需要补,而不是 UI 这层硬性拦截(避免妨碍调试用法)。
            applyRealityForm() {
                // 前置校验:reality 没 keypair 是绝对跑不起来的,这里挡一下
                // 而不是让用户提交后被 xray test 拒掉再绕回来。dest 没填走默认。
                const f = this.inModal.realityForm;
                if (!f.privateKey) {
                    this.$message.warning('请填 Private Key(节点上跑 xray x25519 拿到)');
                    return;
                }
                if (!f.publicKey) {
                    this.$message.warning('请填 Public Key(分享链接需要,xray x25519 同时输出)');
                    return;
                }
                if (!f.serverNames) {
                    this.$message.warning('请填至少一个 SNI(serverNames),逗号分隔多个');
                    return;
                }
                const split = (s) => (s || '')
                    .split(',')
                    .map(x => x.trim())
                    .filter((x, i, arr) => x !== '' || i === arr.length - 1 ||
                            (arr.length === 1));  // 保留唯一空字符串(允许任意 sid)
                // shortIds 允许空字符串作为元素(reality 协议:空 sid 匹配任意)
                const shortIds = (this.inModal.realityForm.shortIds || '')
                    .split(',').map(x => x.trim());
                const snippet = {
                    network: 'tcp',
                    security: 'reality',
                    realitySettings: {
                        show: false,
                        dest: this.inModal.realityForm.dest || 'www.cloudflare.com:443',
                        xver: 0,
                        serverNames: split(this.inModal.realityForm.serverNames)
                            .filter(x => x !== ''),
                        privateKey: this.inModal.realityForm.privateKey || '',
                        publicKey: this.inModal.realityForm.publicKey || '',
                        shortIds: shortIds.length ? shortIds : [''],
                        fingerprint: this.inModal.realityForm.fingerprint || 'chrome',
                    },
                };
                this.inModal.rawStreamSettings = JSON.stringify(snippet, null, 2);
                this.inModal.useRawStream = true;
                this.$message.success('已生成 reality 配置到原文模式,保存即可生效');
            },

            resetRealityForm() {
                this.inModal.realityForm = {
                    dest: 'www.cloudflare.com:443',
                    serverNames: 'www.cloudflare.com',
                    privateKey: '',
                    publicKey: '',
                    shortIds: '',
                    fingerprint: 'chrome',
                };
            },

            // buildTLSBlock — 共享 helper:HTTPUpgrade / XHTTP 都需要的 TLS
            // 子对象。空字段不写出去,xray test 拿到无效证书路径时会报错
            // 提示用户补,跟 reality form 同套思路。
            buildTLSBlock(form) {
                const certs = [];
                if (form.certFile || form.keyFile) {
                    certs.push({
                        certificateFile: form.certFile,
                        keyFile: form.keyFile,
                    });
                }
                const tls = {};
                if (form.tlsServer) tls.serverName = form.tlsServer;
                if (certs.length) tls.certificates = certs;
                tls.alpn = ['h2', 'http/1.1'];
                return tls;
            },

            applyHTTPUpgradeForm() {
                const f = this.inModal.huForm;
                if (!f.host) {
                    this.$message.warning('请填 Host(客户端连接时的 Host header)');
                    return;
                }
                if (f.tls && !f.tlsServer) {
                    this.$message.warning('启用 TLS 时需要填 TLS 域名 (SNI)');
                    return;
                }
                if (f.tls && (!f.certFile || !f.keyFile)) {
                    this.$message.warning('启用 TLS 时需要填证书和私钥文件路径');
                    return;
                }
                const snippet = {
                    network: 'httpupgrade',
                    security: f.tls ? 'tls' : 'none',
                    httpupgradeSettings: {
                        host: f.host || '',
                        path: f.path || '/',
                    },
                };
                if (f.tls) snippet.tlsSettings = this.buildTLSBlock(f);
                this.inModal.rawStreamSettings = JSON.stringify(snippet, null, 2);
                this.inModal.useRawStream = true;
                this.$message.success('已生成 HTTPUpgrade 配置到原文模式');
            },
            resetHTTPUpgradeForm() {
                this.inModal.huForm = {
                    host: '', path: '/', tls: true,
                    tlsServer: '', certFile: '', keyFile: '',
                };
            },

            applyXHTTPForm() {
                const f = this.inModal.xhForm;
                if (!f.host) {
                    this.$message.warning('请填 Host');
                    return;
                }
                if (f.tls && !f.tlsServer) {
                    this.$message.warning('启用 TLS 时需要填 TLS 域名');
                    return;
                }
                if (f.tls && (!f.certFile || !f.keyFile)) {
                    this.$message.warning('启用 TLS 时需要填证书和私钥文件路径');
                    return;
                }
                const snippet = {
                    network: 'xhttp',
                    security: f.tls ? 'tls' : 'none',
                    xhttpSettings: {
                        host: f.host || '',
                        path: f.path || '/',
                        mode: f.mode || 'auto',
                    },
                };
                if (f.tls) snippet.tlsSettings = this.buildTLSBlock(f);
                this.inModal.rawStreamSettings = JSON.stringify(snippet, null, 2);
                this.inModal.useRawStream = true;
                this.$message.success('已生成 XHTTP 配置到原文模式');
            },
            resetXHTTPForm() {
                this.inModal.xhForm = {
                    host: '', path: '/', mode: 'auto', tls: true,
                    tlsServer: '', certFile: '', keyFile: '',
                };
            },
        },
        watch: {
            // First time the operator flips on raw mode in this dialog,
            // seed the textarea with their current form-side stream so
            // they edit a real starting point instead of an empty box.
            'inModal.useRawStream'(on) {
                if (on && !this.inModal.rawStreamSettings) {
                    try {
                        this.inModal.rawStreamSettings = JSON.stringify(
                            JSON.parse(this.inModal.inbound.stream.toString()),
                            null, 2);
                    } catch (e) {
                        this.inModal.rawStreamSettings = '';
                    }
                }
            },
        },
    });

</script>
{{end}}
