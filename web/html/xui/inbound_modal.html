{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        // 当 useRawStream=true 时,inbounds.html 提交时会用 rawStreamSettings 当
        // streamSettings,绕过 inbound.stream.toString() 的 form-to-JSON 流程。
        // 这是 v1.0.6 让用户能在 UI 里立刻用 REALITY / XHTTP 的最小手段 ——
        // 完整专用表单留 v1.0.7+。后端 dry-run 兜底,写错直接拒绝不会害到面板。
        useRawStream: false,
        rawStreamSettings: '',
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            // Each show() resets raw-mode — operator opts in per-edit, so
            // an old inbound that was saved with raw JSON gets re-rendered
            // through the form on the next open (and they can flip raw back
            // on if they need to keep editing the JSON).
            this.useRawStream = false;
            this.rawStreamSettings = '';
            this.confirm = confirm;
            this.visible = true;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        DOKODEMO: Protocols.DOKODEMO,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            }
        },
        methods: {
            streamNetworkChange(oldValue) {
                if (oldValue === 'kcp') {
                    this.inModal.inbound.tls = false;
                }
            },
            // Pre-baked streamSettings JSON snippets so users don't have to
            // memorize the schema. The placeholder values (PUBLIC_KEY etc.)
            // are intentionally obvious so xray test will reject them on
            // submit — forcing the operator to fill them in instead of
            // accidentally shipping a template inbound.
            loadStreamTemplate(kind) {
                let snippet;
                if (kind === 'reality') {
                    snippet = {
                        network: 'tcp',
                        security: 'reality',
                        realitySettings: {
                            show: false,
                            dest: 'www.cloudflare.com:443',
                            xver: 0,
                            serverNames: ['www.cloudflare.com'],
                            privateKey: '<RUN: xray x25519 — 把 Private key 贴这里>',
                            publicKey:  '<RUN: xray x25519 — 把 Public key 贴这里>',
                            shortIds: ['', '0123abcd'],
                            fingerprint: 'chrome',
                        },
                    };
                } else if (kind === 'xhttp') {
                    snippet = {
                        network: 'xhttp',
                        security: 'tls',
                        xhttpSettings: {
                            host: '',
                            path: '/your-path',
                            mode: 'auto',  // auto | packet-up | stream-up
                        },
                        tlsSettings: {
                            serverName: 'your.domain.com',
                            certificates: [
                                { certificateFile: '/root/cert/your.cer', keyFile: '/root/cert/your.key' },
                            ],
                            alpn: ['h2', 'http/1.1'],
                        },
                    };
                } else if (kind === 'httpupgrade') {
                    snippet = {
                        network: 'httpupgrade',
                        security: 'tls',
                        httpupgradeSettings: {
                            host: 'your.domain.com',
                            path: '/your-path',
                        },
                        tlsSettings: {
                            serverName: 'your.domain.com',
                            certificates: [
                                { certificateFile: '/root/cert/your.cer', keyFile: '/root/cert/your.key' },
                            ],
                        },
                    };
                } else if (kind === 'current') {
                    // Re-pull from the form-side model: lets the user start
                    // from whatever they already configured (TLS+TCP etc.)
                    // and tweak just the new fields they need.
                    try {
                        snippet = JSON.parse(this.inModal.inbound.stream.toString());
                    } catch (e) {
                        snippet = {};
                    }
                }
                this.inModal.rawStreamSettings = JSON.stringify(snippet, null, 2);
            },
        },
        watch: {
            // First time the operator flips on raw mode in this dialog,
            // seed the textarea with their current form-side stream so
            // they edit a real starting point instead of an empty box.
            'inModal.useRawStream'(on) {
                if (on && !this.inModal.rawStreamSettings) {
                    try {
                        this.inModal.rawStreamSettings = JSON.stringify(
                            JSON.parse(this.inModal.inbound.stream.toString()),
                            null, 2);
                    } catch (e) {
                        this.inModal.rawStreamSettings = '';
                    }
                }
            },
        },
    });

</script>
{{end}}
