{{define "commonSider"}}
<a-layout-sider id="sider" collapsible
                breakpoint="md" :collapsed-width="64"
                :width="220">
    <a-menu theme="dark" mode="inline" :selected-keys="['{{ .request_uri }}']"
            @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
        {{template "menuItems" .}}
    </a-menu>
</a-layout-sider>
<script>
    // siderDrawer 现在是个 stub:旧版在窄屏下用 a-drawer + 外挂 handle 触发,
    // 新版改用 a-layout-sider 自带的底部 trigger 按钮(更符合现代 admin 范式),
    // drawer 已被删除。各页面仍把 siderDrawer 注入 data 是历史代码,留个空对象
    // 防止 vue 模板里访问未声明字段报错。
    const siderDrawer = { visible: false, show(){}, close(){}, change(){} };
</script>
{{end}}
