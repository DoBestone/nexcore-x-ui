{{define "form/inbound"}}
<!-- base -->
<a-form layout="inline">
    <a-form-item label='{{ i18n "remark" }}'>
        <a-input v-model.trim="dbInbound.remark"></a-input>
    </a-form-item>
    <a-form-item label='{{ i18n "enable" }}'>
        <a-switch v-model="dbInbound.enable"></a-switch>
    </a-form-item>
    <a-form-item label='{{ i18n "protocol" }}'>
        <a-select v-model="inbound.protocol" style="width: 160px;">
            <a-select-option v-for="p in Protocols" :key="p" :value="p">[[ p ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            监听 IP
            <a-tooltip>
                <template slot="title">
                    默认留空即可
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-input v-model.trim="inbound.listen"></a-input>
    </a-form-item>
    <a-form-item label="端口">
        <a-input type="number" v-model.number="inbound.port"></a-input>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            总流量(GB)
            <a-tooltip>
                <template slot="title">
                    0 表示不限制
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-input-number v-model="dbInbound.totalGB" :min="0"></a-input-number>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            到期时间
            <a-tooltip>
                <template slot="title">
                    留空则永不到期
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                       v-model="dbInbound._expiryTime" style="width: 300px;"></a-date-picker>
    </a-form-item>
</a-form>

<!-- vmess settings -->
<template v-if="inbound.protocol === Protocols.VMESS">
    {{template "form/vmess"}}
</template>

<!-- vless settings -->
<template v-if="inbound.protocol === Protocols.VLESS">
    {{template "form/vless"}}
</template>

<!-- trojan settings -->
<template v-if="inbound.protocol === Protocols.TROJAN">
    {{template "form/trojan"}}
</template>

<!-- shadowsocks -->
<template v-if="inbound.protocol === Protocols.SHADOWSOCKS">
    {{template "form/shadowsocks"}}
</template>

<!-- dokodemo-door -->
<template v-if="inbound.protocol === Protocols.DOKODEMO">
    {{template "form/dokodemo"}}
</template>

<!-- socks -->
<template v-if="inbound.protocol === Protocols.SOCKS">
    {{template "form/socks"}}
</template>

<!-- http -->
<template v-if="inbound.protocol === Protocols.HTTP">
    {{template "form/http"}}
</template>

<!-- stream settings -->
<template v-if="inbound.canEnableStream()">
    {{template "form/streamSettings"}}
</template>

<!-- tls settings -->
<template v-if="inbound.canEnableTls()">
    {{template "form/tlsSettings"}}
</template>

<!-- sniffing -->
<template v-if="inbound.canSniffing()">
    {{template "form/sniffing"}}
</template>

<!-- 高级:streamSettings 原文 JSON ============================================
     2026 后的 xray-core 协议字段(REALITY / XHTTP / HTTPUpgrade / uTLS
     fingerprint 等)还没在上面的 form 里全部铺开,但 streamSettings 本身就是
     "原样透传给 xray" 的 JSON 字符串 —— 所以这个折叠面板让用户直接编辑这串
     原文,任意 xray 支持的字段都能立刻用上。开启后会覆盖 form 拼出来的
     streamSettings;后端的 dry-run 校验会兜底,写错也不会让其他入站挂掉。 -->
<a-collapse style="margin-top: 12px;">
    <a-collapse-panel header="高级:streamSettings 原文 JSON(REALITY / XHTTP / uTLS 等)">
        <a-alert type="info" show-icon style="margin-bottom: 10px;">
            <span slot="message">
                启用此处 textarea 后,保存入站时会直接以这段 JSON 作为
                streamSettings 提交,覆盖上方 form 字段。后端会用
                <code>xray test</code> 校验;不通过会精确告诉你哪个字段错了。
            </span>
        </a-alert>
        <a-form layout="inline" style="margin-bottom: 8px;">
            <a-form-item label="启用原文模式">
                <a-switch v-model="inModal.useRawStream"></a-switch>
            </a-form-item>
            <template v-if="inModal.useRawStream">
                <a-form-item label="模板">
                    <a-button-group>
                        <a-button size="small" @click="loadStreamTemplate('reality')">VLESS + REALITY + Vision</a-button>
                        <a-button size="small" @click="loadStreamTemplate('xhttp')">XHTTP</a-button>
                        <a-button size="small" @click="loadStreamTemplate('httpupgrade')">HTTPUpgrade</a-button>
                        <a-button size="small" @click="loadStreamTemplate('current')">从 form 同步当前</a-button>
                    </a-button-group>
                </a-form-item>
            </template>
        </a-form>
        <a-input v-if="inModal.useRawStream" type="textarea" :rows="16"
                 v-model="inModal.rawStreamSettings"
                 placeholder='{"network":"tcp","security":"reality","realitySettings":{...}}'
                 style="font-family: var(--font-mono); font-size: 12.5px;"></a-input>
        <p v-if="inModal.useRawStream" style="color: #94a3b8; font-size: 12px; margin-top: 6px;">
            REALITY 模板里的 privateKey / publicKey 需要你在节点上跑
            <code class="mono">xray x25519</code> 生成 keypair,把
            两个值分别填到对应字段;shortIds 是短随机十六进制串(8 字符或更短)。
        </p>
    </a-collapse-panel>
</a-collapse>
{{end}}
