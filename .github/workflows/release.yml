name: release

# Triggered by pushing a tag like v1.2.3 (or running manually). The job
# cross-compiles linux binaries for the architectures we ship, packages
# each into nexcore-x-ui-linux-<arch>.tar.gz alongside the matching
# xray-core binary + geoip/geosite, and uploads them all to the github
# release whose name matches the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # SLSA build provenance attestation. Required by
  # actions/attest-build-provenance to mint a signed claim that links
  # this release tarball back to this exact workflow run, on this exact
  # commit. Operators (or downstream tooling) can verify with:
  #     gh attestation verify nexcore-x-ui-linux-amd64.tar.gz \
  #         --owner DoBestone
  # which closes the "did THIS binary really come out of THIS repo's CI?"
  # gap that SHA256 checksums alone don't — checksums prove the release
  # asset matches the file the publisher uploaded, but say nothing about
  # who the publisher is or what built it.
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            cc: x86_64-linux-gnu-gcc
            apt: gcc-x86-64-linux-gnu
            xray: Xray-linux-64.zip
            xray_bin: xray-linux-amd64
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
            xray: Xray-linux-arm64-v8a.zip
            xray_bin: xray-linux-arm64
          - arch: armv7
            goarch: arm
            goarm: '7'
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
            xray: Xray-linux-arm32-v7a.zip
            xray_bin: xray-linux-arm
          - arch: s390x
            goarch: s390x
            cc: s390x-linux-gnu-gcc
            apt: gcc-s390x-linux-gnu
            xray: Xray-linux-s390x.zip
            xray_bin: xray-linux-s390x
    steps:
      # Actions are pinned to commit SHAs (with the human-readable tag
      # in a trailing comment) so a compromise of the action's tag
      # namespace can't silently inject build-time code on every
      # release. Bump these together with the version comments when
      # upgrading; verify by clicking through to the action's tag page.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          # Explicit cache: setup-go v5+ defaults to true when go.sum
          # exists, but pinning it removes ambiguity. Keys off go.sum
          # so a deps change invalidates exactly when expected.
          cache: true

      # v2.0:Vue 3 SPA 构建产物嵌入 Go 二进制(`go:embed all:frontend/dist`),
      # 所以 Go build 之前必须先跑前端 build。Node 钉死 20.x —— 升级前
      # 在本地验证 npm ci + npm run build 仍干净通过。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: build frontend SPA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd web/frontend
          npm ci
          npm run build

      - name: install cross compiler
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ matrix.apt }} unzip wget

      # Cache xray binary + geo data: each is ~30MB, doesn't change between
      # our releases (we always grab Xray-core's :latest tag), and across
      # 4 matrix legs we re-download the same content 4×. Hash key is by
      # arch + month so a new xray major/geo refresh still rolls forward
      # within a reasonable window without manual cache busts.
      - name: cache xray + geo data
        id: xraycache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            stage/nexcore-x-ui/bin/${{ matrix.xray_bin }}
            stage/nexcore-x-ui/bin/geoip.dat
            stage/nexcore-x-ui/bin/geosite.dat
          # Bump the cache version (`v1`) when xray-core has a breaking
          # change you want to force-grab; month component handles slow
          # rolls automatically.
          key: xray-geo-v1-${{ matrix.arch }}-${{ format('{0}-{1}', github.event.repository.updated_at, matrix.xray) }}

      - name: build panel binary
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath -ldflags '-s -w -X main.buildTag=${{ github.ref_name }}' -o panel-bin main.go
          mkdir -p stage/nexcore-x-ui/bin
          cp panel-bin              stage/nexcore-x-ui/nexcore-x-ui
          cp nexcore-x-ui.service   stage/nexcore-x-ui/nexcore-x-ui.service
          cp nexcore-x-ui.sh        stage/nexcore-x-ui/nexcore-x-ui.sh

      - name: bundle xray + geo data
        # Cache hit:已经有 xray + geo dat,跳过重新下载。Cache miss:全套
        # 重新拉。注意 xray zip 里的 geoip.dat/geosite.dat 没 Loyalsoldier
        # 那份完整,所以始终用后者覆盖。
        if: steps.xraycache.outputs.cache-hit != 'true'
        working-directory: stage/nexcore-x-ui/bin
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray }}
          unzip -q ${{ matrix.xray }}
          rm -f ${{ matrix.xray }} geoip.dat geosite.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray ${{ matrix.xray_bin }}
          chmod +x ${{ matrix.xray_bin }}

      - name: package
        run: |
          cd stage
          tar -czf ../nexcore-x-ui-linux-${{ matrix.arch }}.tar.gz nexcore-x-ui

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexcore-x-ui-linux-${{ matrix.arch }}
          path: nexcore-x-ui-linux-${{ matrix.arch }}.tar.gz

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist/

      # Produce checksums.txt covering every tarball. Both the panel's
      # self-update path (web/service/update.go) and update.sh fetch this
      # alongside the tarball and abort if SHA256 doesn't match — without
      # it an attacker who can swap a release asset would get RCE on every
      # node that runs `nexcore-x-ui update`.
      - name: generate checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # Build provenance attestation. Mints SLSA v1 build provenance for
      # every release tarball and stores it in the GitHub Sigstore
      # transparency log. Verifiable via `gh attestation verify` (see
      # the permissions block at the top of this file for the command).
      # Subject paths must match the actual files we ship; checksums.txt
      # is intentionally excluded — it's a verification helper, not a
      # binary the user runs.
      - uses: actions/attest-build-provenance@173725a1209d09b31f9d30a3890cf2757ebbff0d # v1.4.4
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
