name: ✨ Feature 提案
description: 提一个新功能 / API / 配置项
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        想清楚再开 issue。模糊的「希望支持 XXX」我们一般不会单独跟,要么有清晰
        的使用场景 + 预期 API 形态,要么直接发 PR 让代码说话。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 用户场景描述。"我每次 X 都要 Y,挺烦"。**别上来就给方案**,先讲问题。
      placeholder: |
        我有 50 台节点,每次新建一个 inbound 都要在面板里手动加,
        想用脚本批量加但 /api/v1/inbounds 一次只能加一条。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想要的样子
      description: 如果要加 API,贴个 curl 例子或字段表;如果要加 UI,描一下交互
      placeholder: |
        POST /api/v1/inbounds/bulk 接收数组,要么全成功要么全回滚,
        响应给每条的 id 跟 error。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你试过 / 考虑过的其它做法,以及为啥它们不够
      placeholder: 写脚本 for 循环调单条 API — 慢 + 中途失败要手动清理
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight
      options:
        - label: 我搜过现有 issues 和 [Discussions](https://github.com/DoBestone/nexcore-x-ui/discussions),没看到重复提案
          required: true
        - label: 我接受这个提案可能被维护者出于"超出项目范围"等理由婉拒
          required: true
